      <stop offset="50%" stop-color="#241B18" />
      <stop offset="100%" stop-color="#120D0B" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg7)" />
  <ellipse cx="640" cy="130" rx="165" ry="60" transform="rotate(-18 640 130)" fill="#2D4A33" opacity="0.4" />

