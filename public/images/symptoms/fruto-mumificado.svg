  />

  <!-- Deep shriveled mummy wrinkles & crevices -->
  <path d="M460 186C452 276 468 394 470 498" stroke="#0F0A08" stroke-width="5" stroke-linecap="round" />
  <path d="M426 206C414 278 424 386 446 478" stroke="#0F0A08" stroke-width="4" stroke-linecap="round" />
  <path d="M498 206C512 278 504 386 488 478" stroke="#574740" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <!-- Residual pale crusty spore patches on dry skin -->
  <ellipse cx="446" cy="316" rx="22" ry="15" transform="rotate(-12 446 316)" fill="#9CA3AF" opacity="0.28" />
  <ellipse cx="486" cy="378" rx="18" ry="12" transform="rotate(14 486 378)" fill="#A8A29E" opacity="0.24" />
