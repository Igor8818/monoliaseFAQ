<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D2B20" />
      <stop offset="100%" stop-color="#0E1710" />
    </linearGradient>
    <linearGradient id="trunk7" x1="150" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#36261C" />
      <stop offset="50%" stop-color="#533B2C" />
      <stop offset="100%" stop-color="#271A12" />
