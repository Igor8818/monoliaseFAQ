  <!-- Shrunken, hard, petrified blackened mummy pod -->
  <path
    d="M454 176C416 184 388 242 396 312C402 362 394 402 414 446C428 478 448 504 470 508C496 504 516 472 526 436C542 384 532 332 534 294C538 230 502 174 454 176Z"
